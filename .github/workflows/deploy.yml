name: Deploy to AWS S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write 
  contents: read   

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::342764460978:role/GitHubActionsRole   
          aws-region: us-east-1 

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://logistics-site-bucket --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      # Optional: Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
         aws cloudfront create-invalidation --distribution-id E31CV62KH8TPRX --paths "/*"
